<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>모임</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="모임">
  <style>
    :root {
      --bg: #f4f4f7; --card: #fff; --text: #17171c; --sub: #6b6b78; --line: #e6e6ec;
      --accent: #4f46e5; --accent-soft: #eceafd; --ok: #0f9d58; --ok-soft: #e3f5ea; --warn: #c2410c; --danger: #d92d20;
      --radius: 14px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101014; --card: #1b1b22; --text: #f1f1f4; --sub: #9a9aa8; --line: #2c2c36;
        --accent: #8b85ff; --accent-soft: #26244a; --ok: #4ade80; --ok-soft: #173325; --warn: #fb923c; --danger: #f87171;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    input, textarea { font: inherit; color: var(--text); }

    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 8px;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    header h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -0.02em; }
    header .back { font-size: 22px; padding: 4px 8px 4px 0; }
    .me-chip { font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }

    main { max-width: 560px; margin: 0 auto; padding: 4px 16px 16px; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--sub); margin: 20px 4px 8px; }

    .card {
      display: block; background: var(--card); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--line);
    }
    .card-top { display: flex; align-items: center; gap: 8px; }
    .card-title { font-weight: 650; font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: var(--sub); font-size: 14px; margin-top: 4px; }
    .meta span + span::before { content: "·"; margin: 0 6px; }
    .past { opacity: .78; }

    .badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
    .b-vote { background: var(--accent-soft); color: var(--accent); }
    .b-dday { background: var(--ok-soft); color: var(--ok); }
    .b-todo { background: transparent; color: var(--warn); border: 1px solid currentColor; }
    .b-done { background: var(--line); color: var(--sub); }

    .fab {
      position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom));
      background: var(--accent); color: #fff; font-weight: 650;
      padding: 14px 20px; border-radius: 999px; box-shadow: 0 6px 20px rgba(79,70,229,.35);
    }

    .empty { text-align: center; color: var(--sub); padding: 60px 16px; }
    .empty b { display: block; font-size: 40px; margin-bottom: 8px; }

    /* 상세 */
    .hero { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; }
    .hero h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
    .hero .when { font-size: 20px; font-weight: 700; color: var(--accent); margin: 10px 0 2px; }
    .place-link { display: inline-flex; gap: 4px; color: var(--sub); font-size: 15px; }
    .place-link:hover { text-decoration: underline; }
    .mapbox { position: relative; height: 160px; margin-top: 12px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--line); }
    #map { position: absolute; inset: 0; z-index: 0; }
    .map-open { position: absolute; inset: 0; z-index: 1000; display: flex; align-items: flex-end; justify-content: flex-start; padding: 8px; }
    .map-open span { font-size: 12px; font-weight: 600; background: var(--card); color: var(--text); padding: 4px 10px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    .pin { width: 28px; height: 28px; background: var(--accent); border: 3px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
    .row-actions { display: flex; gap: 14px; margin-top: 12px; font-size: 14px; color: var(--sub); }
    .row-actions button, .row-actions a { color: var(--sub); text-decoration: underline; text-underline-offset: 3px; padding: 0; }

    .cand { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
    .cand.top { border-color: var(--accent); }
    .tick {
      flex: none; width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line);
      display: grid; place-items: center; font-size: 20px; font-weight: 700; color: transparent;
    }
    .tick.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .cand-body { flex: 1; min-width: 0; }
    .cand-date { font-weight: 650; }
    .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 8px 0 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
    .names { font-size: 13px; color: var(--sub); }
    .decide-btn { flex: none; font-size: 13px; font-weight: 600; color: var(--accent); padding: 6px 10px; border: 1px solid var(--accent); border-radius: 999px; align-self: center; }

    textarea, input[type=text], input[type=date], input[type=time] {
      width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; outline: none; min-height: 48px;
    }
    textarea { min-height: 140px; resize: vertical; }
    textarea:focus, input:focus { border-color: var(--accent); }
    label.field { display: block; margin-bottom: 16px; }
    label.field > span { display: block; font-size: 14px; font-weight: 600; margin: 0 2px 6px; }
    .hint { font-size: 13px; color: var(--sub); margin: 4px 2px 0; }
    .cand-edit { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .cand-edit input[type=date] { flex: 1.4; }
    .cand-edit input[type=time] { flex: 1; }
    .cand-edit .x { flex: none; width: 40px; height: 48px; font-size: 20px; color: var(--sub); }

    .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-weight: 650; text-align: center; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { border: 1px dashed var(--line); color: var(--sub); }
    .btn-danger { color: var(--danger); margin-top: 28px; }
    .btn:disabled { opacity: .5; }
    .saved { font-size: 13px; color: var(--ok); margin-left: 8px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
      opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px);
    }
    .toast.show { opacity: 1; }
    /* 메인 */
    .greet { font-size: 15px; color: var(--sub); margin: 8px 4px 16px; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tile {
      position: relative; display: block; background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 18px 16px; min-height: 148px;
      transition: transform .1s;
    }
    .tile:active { transform: scale(.97); }
    a.tile { border-color: var(--accent); box-shadow: 0 4px 14px rgba(79,70,229,.10); }
    .tile-icon { font-size: 34px; line-height: 1; margin-bottom: 14px; }
    .tile-name { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
    .tile-desc { font-size: 13px; color: var(--sub); margin-top: 4px; line-height: 1.4; word-break: keep-all; }
    .tile-desc b { color: var(--accent); font-weight: 650; }
    .tile.off { opacity: .55; }
    .soon { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 600; color: var(--sub); background: var(--line); padding: 2px 8px; border-radius: 999px; }

    /* 사진 */
    .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 10px; }
    .pgrid:empty { display: none; }
    .pthumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--line); padding: 0; }
    .pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pending { display: grid; place-items: center; }
    .spin { width: 22px; height: 22px; border: 3px solid var(--sub); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .padd { cursor: pointer; }
    .padd[hidden] { display: none; }
    .prm { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; }
    .viewer { position: fixed; inset: 0; z-index: 2000; background: #000; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
    .vimg { max-width: 100%; max-height: 100%; object-fit: contain; }
    .vbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px 16px; color: #fff; font-size: 14px; background: linear-gradient(rgba(0,0,0,.6), transparent); z-index: 1; }
    .vby { flex: 1; opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vbar button { color: #fff; }
    .vdel { font-size: 14px; opacity: .85; }
    .vclose { font-size: 22px; padding: 4px 8px; }
    .vnav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; font-size: 36px; color: #fff; background: rgba(0,0,0,.25); }
    .vnav.prev { left: 0; border-radius: 0 10px 10px 0; } .vnav.next { right: 0; border-radius: 10px 0 0 10px; }
    .vnav[hidden] { display: none; }

    /* 공지 */
    .snippet { font-size: 14px; color: var(--sub); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nbody { margin-top: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.65; }
    .link { color: var(--accent); text-decoration: underline; word-break: break-all; }
    .check { display: flex; align-items: center; gap: 8px; margin: -4px 2px 16px; font-size: 15px; }
    .check input { width: 20px; height: 20px; accent-color: var(--accent); }

    .skeleton { height: 76px; border-radius: var(--radius); background: var(--card); margin-bottom: 10px; opacity: .6; }
  </style>
</head>
<body>
  <header id="hdr"></header>
  <main id="app"></main>
  <div id="fab"></div>
  <div class="toast" id="toast"></div>

  <script>
  // ---------- 공통 ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let me = store.get("moim.name") || "";

  async function api(path, method = "GET", body) {
    const r = await fetch("/api" + path, {
      method,
      headers: body ? { "content-type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "서버 오류가 났어요");
    return d;
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ---------- 날짜 ----------
  const WD = ["일", "월", "화", "수", "목", "금", "토"];
  const pad = (n) => String(n).padStart(2, "0");
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const toDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  function fmtCand(c, withYear) {
    const d = toDate(c.date);
    const y = withYear || d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}년 ` : "";
    let s = `${y}${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
    if (c.time) {
      const [h, mi] = c.time.split(":").map(Number);
      s += ` ${h < 12 ? "오전" : "오후"} ${h % 12 || 12}시${mi ? ` ${mi}분` : ""}`;
    }
    return s;
  }
  const sortKey = (c) => c.date + "T" + (c.time || "00:00");
  const dday = (dateStr) => Math.round((toDate(dateStr) - toDate(todayStr())) / 86400000);
  const decidedOf = (ev) => ev.candidates.find((c) => c.id === ev.decidedId);
  const mapUrl = (place) => "https://map.naver.com/p/search/" + encodeURIComponent(place);

  // ---------- 지도 미리보기 (Leaflet + OpenStreetMap, 키 필요 없음) ----------
  let leafletP;
  function loadLeaflet() {
    return (leafletP ||= new Promise((res, rej) => {
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
      document.head.appendChild(css);
      const js = document.createElement("script");
      js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
      js.onload = () => res(window.L);
      js.onerror = () => { leafletP = null; rej(new Error("지도를 불러오지 못했어요")); };
      document.head.appendChild(js);
    }));
  }
  async function drawMap(el, lat, lng) {
    try {
      const L = await loadLeaflet();
      if (!el.isConnected) return;
      const m = L.map(el, {
        zoomControl: false, dragging: false, touchZoom: false, scrollWheelZoom: false,
        doubleClickZoom: false, boxZoom: false, keyboard: false, tap: false,
      }).setView([lat, lng], 16);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "© OpenStreetMap",
      }).addTo(m);
      L.marker([lat, lng], {
        icon: L.divIcon({ className: "", html: '<div class="pin"></div>', iconSize: [28, 28], iconAnchor: [14, 28] }),
      }).addTo(m);
    } catch { el.closest(".mapbox")?.remove(); }
  }

  // ---------- 화면 틀 ----------
  function setHeader(title, back) {
    $("hdr").innerHTML = `
      ${back ? `<a class="back" href="${back}" aria-label="뒤로">‹</a>` : ""}
      <h1>${esc(title)}</h1>
      ${me ? `<button class="me-chip" id="meBtn">${esc(me)} ✎</button>` : ""}`;
    const b = $("meBtn"); if (b) b.onclick = askName;
  }
  // 오른쪽 아래 떠 있는 버튼. setFab(false)로 숨김
  function setFab(href, label) {
    $("fab").innerHTML = href ? `<a class="fab" href="${href}">${esc(label)}</a>` : "";
  }

  function askName() {
    setHeader("모임"); setFab(false);
    $("app").innerHTML = `
      <div style="padding-top:40px">
        <h2 style="margin:0 0 6px">이름을 알려주세요</h2>
        <p class="hint" style="margin-bottom:20px">투표할 때 친구들에게 보이는 이름이에요.</p>
        <label class="field"><input type="text" id="nameIn" maxlength="20" placeholder="예: 권" value="${esc(me)}" autocomplete="nickname"></label>
        <button class="btn btn-primary" id="nameOk">시작하기</button>
      </div>`;
    const go = () => {
      const v = $("nameIn").value.trim();
      if (!v) return toast("이름을 입력해 주세요");
      me = v; store.set("moim.name", v); route();
    };
    $("nameOk").onclick = go;
    $("nameIn").onkeydown = (e) => { if (e.key === "Enter") go(); };
    $("nameIn").focus();
  }

  // ---------- 사진 (일정·공지 공용) ----------
  // 올리기 전에 폰에서 줄임: 본문용 긴 변 1600px, 썸네일 480px. 원본은 올리지 않음
  async function shrink(file, max, quality) {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch {
      src = await new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = () => rej(new Error("이 사진은 열 수 없어요"));
        img.src = URL.createObjectURL(file);
      });
    }
    const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
    const r = Math.min(1, max / Math.max(sw, sh));
    const w = Math.round(sw * r), h = Math.round(sh * r);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(src, 0, 0, w, h);
    const enc = (type, q) => new Promise((res) => c.toBlob(res, type, q));
    let blob = await enc("image/webp", quality);
    if (!blob || blob.type !== "image/webp") blob = await enc("image/jpeg", quality); // 아이폰 사파리는 WebP 저장 불가
    return { blob, w, h };
  }
  async function preparePhoto(file) {
    let full = await shrink(file, 1600, 0.8);
    if (full.blob.size > 1.4 * 1024 * 1024) full = await shrink(file, 1280, 0.6);
    const thumb = await shrink(file, 480, 0.7);
    return { full, thumb };
  }
  async function uploadPhoto(parent, file) {
    const { full, thumb } = await preparePhoto(file);
    const ext = (b) => (b.type === "image/webp" ? "webp" : "jpg");
    const fd = new FormData();
    fd.append("parent", parent);
    fd.append("by", me);
    fd.append("w", full.w); fd.append("h", full.h);
    fd.append("full", full.blob, "full." + ext(full.blob));
    fd.append("thumb", thumb.blob, "thumb." + ext(thumb.blob));
    const r = await fetch("/api/photos", { method: "POST", body: fd });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "사진을 올리지 못했어요");
    return d.photo;
  }

  // 글 하나에 붙는 사진 묶음 화면. 같은 글을 다시 그려도(투표 등) 올리는 중인 상태가 유지되도록 재사용
  const MAX_PHOTOS = 10; // 글 하나당 사진 수 (서버 lib/photos.mjs의 MAX_PER_PARENT와 같게)
  const photoWidgets = new Map();
  let uploading = 0;
  function mountPhotos(slot, parent) {
    let w = photoWidgets.get(parent);
    if (!w) {
      const el = document.createElement("div");
      el.innerHTML = `
        <div class="section-title">사진 <span class="pc"></span></div>
        <div class="pgrid"></div>
        <label class="btn btn-ghost padd">+ 사진 추가<input type="file" accept="image/*" multiple hidden></label>
        <p class="hint pstatus"></p>`;
      w = { el, parent, photos: [], pending: 0 };
      photoWidgets.set(parent, w);
      el.querySelector("input").onchange = (e) => { addPhotos(w, [...e.target.files]); e.target.value = ""; };
      api(`/photos?parent=${parent}`).then((d) => { w.photos = d.photos; drawPhotos(w); }).catch(() => {});
    }
    slot.replaceWith(w.el);
    drawPhotos(w);
  }
  function drawPhotos(w) {
    w.el.querySelector(".pc").textContent = w.photos.length ? `${w.photos.length}/${MAX_PHOTOS}` : "";
    w.el.querySelector(".padd").hidden = w.photos.length + w.pending >= MAX_PHOTOS;
    w.el.querySelector(".pgrid").innerHTML =
      w.photos.map((p, i) => `<button class="pthumb" data-i="${i}" aria-label="사진 크게 보기"><img loading="lazy" src="/api/photos/${p.id}/thumb" alt=""></button>`).join("") +
      `<div class="pthumb pending"><span class="spin"></span></div>`.repeat(w.pending);
    w.el.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => openViewer(w, +b.dataset.i));
  }
  async function addPhotos(w, files) {
    const st = w.el.querySelector(".pstatus");
    const room = MAX_PHOTOS - w.photos.length - w.pending;
    if (room <= 0) return toast(`사진은 글 하나에 ${MAX_PHOTOS}장까지예요`);
    if (files.length > room) { toast(`${MAX_PHOTOS}장까지라서 ${room}장만 올릴게요`); files = files.slice(0, room); }
    w.pending += files.length; uploading += files.length; drawPhotos(w);
    let done = 0, failed = 0;
    for (const f of files) {
      st.textContent = `올리는 중… ${done + failed + 1}/${files.length}`;
      try { w.photos.push(await uploadPhoto(w.parent, f)); done++; }
      catch (e) { failed++; toast(e.message); }
      w.pending--; uploading--; drawPhotos(w);
    }
    st.textContent = failed ? `${done}장 올림, ${failed}장 실패` : "";
  }

  // 크게 보기 (좌우 넘기기, 휴대폰 뒤로가기로 닫기)
  function openViewer(w, i) {
    const v = document.createElement("div");
    v.className = "viewer";
    v.innerHTML = `
      <div class="vbar"><span class="vcount"></span><span class="vby"></span>
        <button class="vdel">삭제</button><button class="vclose" aria-label="닫기">✕</button></div>
      <img class="vimg" alt="">
      <button class="vnav prev" aria-label="이전">‹</button><button class="vnav next" aria-label="다음">›</button>`;
    document.body.appendChild(v);
    document.body.style.overflow = "hidden";
    const show = () => {
      const p = w.photos[i];
      v.querySelector(".vimg").src = `/api/photos/${p.id}/full`;
      v.querySelector(".vcount").textContent = `${i + 1} / ${w.photos.length}`;
      v.querySelector(".vby").textContent = [p.by, fmtWhen(p.at)].filter(Boolean).join(" · ");
      v.querySelector(".prev").hidden = i === 0;
      v.querySelector(".next").hidden = i === w.photos.length - 1;
    };
    const go = (d) => { const n = i + d; if (n >= 0 && n < w.photos.length) { i = n; show(); } };
    let closed = false;
    const close = (fromPop) => {
      if (closed) return; closed = true;
      v.remove(); document.body.style.overflow = "";
      removeEventListener("popstate", onPop); removeEventListener("keydown", onKey);
      if (!fromPop) history.back();
    };
    const onPop = () => close(true);
    const onKey = (e) => { if (e.key === "Escape") close(); if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1); };
    history.pushState({ viewer: 1 }, "");
    addEventListener("popstate", onPop); addEventListener("keydown", onKey);
    v.querySelector(".vclose").onclick = () => close();
    v.querySelector(".prev").onclick = () => go(-1);
    v.querySelector(".next").onclick = () => go(1);
    v.querySelector(".vdel").onclick = async () => {
      if (!confirm("이 사진을 삭제할까요?")) return;
      const p = w.photos[i];
      try { await api(`/photos/${p.id}?parent=${w.parent}`, "DELETE"); }
      catch (e) { return toast(e.message); }
      w.photos.splice(i, 1); drawPhotos(w);
      if (!w.photos.length) return close();
      i = Math.min(i, w.photos.length - 1); show();
    };
    let x0 = null;
    v.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
    v.addEventListener("touchend", (e) => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    });
    show();
  }

  // 작성 시각 표시: 오늘이면 시간, 올해면 월/일, 아니면 연도까지
  function fmtWhen(iso) {
    const d = new Date(iso), now = new Date();
    if (d.toDateString() === now.toDateString()) return `${d.getHours() < 12 ? "오전" : "오후"} ${d.getHours() % 12 || 12}:${pad(d.getMinutes())}`;
    return `${d.getFullYear() !== now.getFullYear() ? d.getFullYear() + "년 " : ""}${d.getMonth() + 1}월 ${d.getDate()}일`;
  }
  // 본문 속 링크를 누를 수 있게
  const linkify = (text) => esc(text).replace(/https?:\/\/[^\s<]+/g, (u) => `<a class="link" href="${u}" target="_blank" rel="noopener">${u}</a>`);

        .filter((x) => x.c && dday(x.c.date) >= 0)
        .sort((a, b) => sortKey(a.c).localeCompare(sortKey(b.c)))[0];
      const bits = [];
      if (next) { const d = dday(next.c.date); bits.push(`다음 모임 ${d === 0 ? "오늘" : "D-" + d}`); }

  // ---------- 목록 ----------
  async function viewList() {
    setHeader("일정", "#/"); setFab("#/schedule/new", "+ 새 일정");
    $("app").innerHTML = `<div style="height:12px"></div>` + `<div class="skeleton"></div>`.repeat(3);
    const { events } = await api("/events");
    if (!events.length) {

      return;
    }
    const voting = events.filter((e) => !e.decidedId).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    const decided = events.filter((e) => e.decidedId)
      .sort((a, b) => sortKey(decidedOf(b)).localeCompare(sortKey(decidedOf(a))));

    let html = "";
    if (voting.length) {
      html += `<div class="section-title">투표 중</div>`;
      for (const e of voting) {
        html += `<a class="card" href="#/schedule/e/${e.id}">
          <div class="card-top"><div class="card-title">${esc(e.title)}</div><span class="badge b-vote">${e.voterCount}명 투표</span></div>
          <div class="meta"><span>후보 ${e.candidates.length}개</span>${e.place ? `<span>${esc(e.place)}</span>` : ""}${e.photoCount ? `<span>📷 ${e.photoCount}</span>` : ""}</div>
        </a>`;
      }
    }
    // 확정된 일정: 최근(날짜가 늦은) 순, 월별로 묶기
    let lastMonth = "";
    for (const e of decided) {
      const c = decidedOf(e);
      const month = c.date.slice(0, 7);
      if (month !== lastMonth) {
        const [y, m] = month.split("-");
        html += `<div class="section-title">${y}년 ${Number(m)}월</div>`;
        lastMonth = month;
      }
      const dd = dday(c.date);
      const badge = dd > 0 ? `<span class="badge b-dday">D-${dd}</span>`
        : dd === 0 ? `<span class="badge b-dday">오늘</span>`
        : e.record ? `<span class="badge b-done">기록 있음</span>`
        : `<span class="badge b-todo">기록 남기기</span>`;
      html += `<a class="card ${dd < 0 ? "past" : ""}" href="#/schedule/e/${e.id}">
        <div class="card-top"><div class="card-title">${esc(e.title)}</div>${badge}</div>
        <div class="meta"><span>${fmtCand(c)}</span>${e.place ? `<span>${esc(e.place)}</span>` : ""}${e.photoCount ? `<span>📷 ${e.photoCount}</span>` : ""}</div>
      </a>`;
    }
    $("app").innerHTML = html;
  }

  // ---------- 상세 ----------
  async function viewDetail(id) {
    setHeader("", "#/schedule"); setFab(false);
    $("app").innerHTML = `<div style="height:12px"></div><div class="skeleton" style="height:140px"></div>`;
    const { event, votes } = await api("/events/" + id);

    renderDetail(event, votes);
  }

  function renderDetail(ev, votes) {
    const count = {}, who = {};
    for (const v of votes) for (const c of v.choices) { count[c] = (count[c] || 0) + 1; (who[c] ||= []).push(v.name); }
    const max = Math.max(0, ...Object.values(count));
    const mine = new Set(votes.find((v) => v.name === me)?.choices || []);
    const dec = decidedOf(ev);
    const placeHref = ev.placeUrl || (ev.place ? mapUrl(ev.place) : "");
    const hasMap = ev.placeLat != null && ev.placeLng != null;
    const place = (placeHref
        ? `<a class="place-link" href="${esc(placeHref)}" target="_blank" rel="noopener">📍 ${esc(ev.place || "네이버 지도에서 보기")}</a>`
        : `<span class="place-link">📍 장소 미정</span>`)
      + (hasMap
        ? `<div class="mapbox"><div id="map"></div>
             <a class="map-open" href="${esc(placeHref)}" target="_blank" rel="noopener"><span>네이버 지도에서 열기 ›</span></a></div>`
        : "");

    let html = "";
    if (dec) {
      const dd = dday(dec.date);
      html += `<div class="hero" style="margin-top:8px">
        <h2>${esc(ev.title)}</h2>
        <div class="when">${fmtCand(dec, true)}</div>
        ${place}
        <div class="meta" style="margin-top:6px">${dd > 0 ? `D-${dd}` : dd === 0 ? "오늘이에요!" : `${-dd}일 전`}${who[dec.id] ? ` · 가능: ${who[dec.id].map(esc).join(", ")}` : ""}</div>
        <div class="row-actions">
          <a href="#/schedule/e/${ev.id}/edit">수정</a>
          <button id="reopen">투표 다시 열기</button>
        </div>
      </div>
      <div class="section-title">모임 기록</div>
      <textarea id="record" placeholder="${dd > 0 ? "모임이 끝나면 어땠는지 남겨보세요" : "누가 왔는지, 뭘 먹었는지, 다음엔 뭘 할지…"}">${esc(ev.record)}</textarea>
      <div style="display:flex;align-items:center;margin-top:10px">
        <button class="btn btn-primary" id="saveRec" style="width:auto;padding:10px 20px">기록 저장</button>
        <span class="saved" id="recSaved"></span>
      </div>`;
    } else {
      html += `<div class="hero" style="margin-top:8px">
        <h2>${esc(ev.title)}</h2>
        ${place}
        <div class="meta" style="margin-top:6px">${votes.length}명 투표${ev.createdBy ? ` · ${esc(ev.createdBy)}님이 만듦` : ""}</div>
        <div class="row-actions"><a href="#/schedule/e/${ev.id}/edit">수정</a></div>
      </div>
      <div class="section-title">가능한 날을 모두 눌러주세요</div>`;
      const cands = [...ev.candidates].sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
      for (const c of cands) {
        const n = count[c.id] || 0;
        const pct = votes.length ? Math.round((n / votes.length) * 100) : 0;
        html += `<div class="cand ${n && n === max ? "top" : ""}">
          <button class="tick ${mine.has(c.id) ? "on" : ""}" data-vote="${c.id}" aria-label="가능">✓</button>
          <div class="cand-body">
            <div class="cand-date">${fmtCand(c)}</div>
            <div class="bar"><i style="width:${pct}%"></i></div>
            <div class="names">${n}명${n ? ` · ${who[c.id].map(esc).join(", ")}` : ""}</div>
          </div>
          <button class="decide-btn" data-decide="${c.id}">확정</button>
        </div>`;
      }
    }
    html += `<div id="photoSlot"></div>`;
    setHeader(dec ? "일정" : "일정 투표", "#/schedule");
    $("app").innerHTML = html;
    if (hasMap) drawMap($("map"), ev.placeLat, ev.placeLng);
    mountPhotos($("photoSlot"), `e-${ev.id}`);

    // 이벤트 연결
    document.querySelectorAll("[data-vote]").forEach((b) => b.onclick = async () => {
      const cid = b.dataset.vote;
      mine.has(cid) ? mine.delete(cid) : mine.add(cid);
      b.classList.toggle("on");
      try {
        const r = await api(`/events/${ev.id}/votes`, "PUT", { name: me, choices: [...mine] });
        renderDetail(ev, r.votes);
      } catch (e) { toast(e.message); viewDetail(ev.id); }
    });
    document.querySelectorAll("[data-decide]").forEach((b) => b.onclick = async () => {
      const c = ev.candidates.find((x) => x.id === b.dataset.decide);
      if (!confirm(`${fmtCand(c)}(으)로 확정할까요?`)) return;
      const r = await api(`/events/${ev.id}`, "PATCH", { decidedId: c.id }).catch((e) => toast(e.message));
      if (r) { toast("일정을 확정했어요"); renderDetail(r.event, r.votes); }
    });
    if ($("reopen")) $("reopen").onclick = async () => {
      if (!confirm("확정을 취소하고 다시 투표할까요?")) return;
      const r = await api(`/events/${ev.id}`, "PATCH", { decidedId: null }).catch((e) => toast(e.message));
      if (r) renderDetail(r.event, r.votes);
    };
    if ($("saveRec")) $("saveRec").onclick = async () => {
      $("saveRec").disabled = true;
      const r = await api(`/events/${ev.id}`, "PATCH", { record: $("record").value }).catch((e) => toast(e.message));
      $("saveRec").disabled = false;
      if (r) { ev.record = r.event.record; $("recSaved").textContent = "저장됨 ✓"; }
    };
  }

    $("delBtn").onclick = async () => {
      if (!confirm("이 공지와 사진이 모두 지워져요. 삭제할까요?")) return;
      await api(`/notices/${n.id}`, "DELETE").catch((e) => toast(e.message));
      location.replace("#/notice");
    };
  }

  async function viewNoticeForm(id) {
    setFab(false);
    let n = null;
    if (id) { setHeader("공지 수정", `#/notice/n/${id}`); n = (await api("/notices/" + id)).notice; }
    else setHeader("새 공지", "#/notice");
    const files = []; // 새 공지일 때 같이 올릴 사진 (저장 후 업로드)
    $("app").innerHTML = `
      <div style="height:8px"></div>
      <label class="field"><span>제목</span><input type="text" id="nTitle" maxlength="100" placeholder="예: 12월 회비 안내" value="${esc(n?.title)}"></label>
      <label class="field"><span>내용</span><textarea id="nBody" maxlength="5000" placeholder="알릴 내용을 적어주세요. 링크도 붙일 수 있어요.">${esc(n?.body)}</textarea></label>
      <label class="check"><input type="checkbox" id="nPin" ${n?.pinned ? "checked" : ""}> 맨 위에 고정</label>
      ${n ? `<p class="hint" style="margin-bottom:16px">사진은 공지 화면에서 추가·삭제할 수 있어요.</p>` : `
      <div class="field"><span style="display:block;font-size:14px;font-weight:600;margin:0 2px 6px">사진</span>
        <div class="pgrid" id="nPrev"></div>
        <label class="btn btn-ghost padd">+ 사진 고르기<input type="file" id="nFiles" accept="image/*" multiple hidden></label>
      </div>`}
      <button class="btn btn-primary" id="nSave">${n ? "저장" : "올리기"}</button>`;

    const drawPrev = () => {
      $("nPrev").innerHTML = files.map((f, i) => `
        <div class="pthumb"><img src="${f.url}" alt=""><button class="prm" data-rm="${i}" aria-label="빼기">✕</button></div>`).join("");
      $("nPrev").querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => {
        URL.revokeObjectURL(files[+b.dataset.rm].url); files.splice(+b.dataset.rm, 1); drawPrev();
      });
    };
    if (!n) $("nFiles").onchange = (e) => {
      const picked = [...e.target.files];
      const room = MAX_PHOTOS - files.length;
      if (picked.length > room) toast(room > 0 ? `${MAX_PHOTOS}장까지라서 ${room}장만 넣었어요` : `사진은 ${MAX_PHOTOS}장까지예요`);
      for (const f of picked.slice(0, Math.max(room, 0))) files.push({ file: f, url: URL.createObjectURL(f) });
      e.target.value = ""; drawPrev();
    };

    $("nSave").onclick = async () => {
      const title = $("nTitle").value.trim();
      if (!title) return toast("제목을 입력해 주세요");
      const btn = $("nSave"); btn.disabled = true;
      const body = { title, body: $("nBody").value, pinned: $("nPin").checked };
      try {
        const r = n ? await api(`/notices/${n.id}`, "PATCH", body) : await api("/notices", "POST", { ...body, by: me });
        let failed = 0;
        for (let i = 0; i < files.length; i++) {
          btn.textContent = `사진 올리는 중… ${i + 1}/${files.length}`;
          try { await uploadPhoto(`n-${r.notice.id}`, files[i].file); } catch { failed++; }
        }
        if (failed) toast(`사진 ${failed}장은 올리지 못했어요`);
        location.replace(`#/notice/n/${r.notice.id}`);
      } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = n ? "저장" : "올리기"; }
    };
  }

  // ---------- 라우팅 ----------
  async function route(keepScroll) {
    if (!me) return askName();
    const y = window.scrollY;
    const h = location.hash.replace(/^#\/?/, "");
    const p = h.split("/");
    try {
      if (p[0] === "schedule") {
        const s = p.slice(1); // #/schedule/...
        if (s[0] === "new") await viewForm();
        else if (s[0] === "e" && s[2] === "edit") await viewForm(s[1]);
        else if (s[0] === "e" && s[1]) await viewDetail(s[1]);
        else await viewList();
      }
      else if (p[0] === "notice") {
        const s = p.slice(1); // #/notice/...
        if (s[0] === "new") await viewNoticeForm();
        else if (s[0] === "n" && s[2] === "edit") await viewNoticeForm(s[1]);
        else if (s[0] === "n" && s[1]) await viewNotice(s[1]);
        else await viewNotices();
      }
      // 예전 주소(#/e/ID)로 공유된 링크도 열리도록
      else if (p[0] === "e" && p[1]) location.replace(`#/schedule/e/${p[1]}`);
      else await viewHome();
    } catch (e) {
      $("app").innerHTML = `<div class="empty"><b>😵</b>${esc(e.message)}<br><br><a href="#/" style="text-decoration:underline">처음으로</a></div>`;
    }
    window.scrollTo(0, keepScroll === true ? y : 0);
  }
  window.addEventListener("hashchange", () => route());
  // 다른 앱 갔다 오면 최신 투표로 새로고침 (작성 중인 화면·저장 안 한 기록은 건드리지 않음)
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !me || /new|edit/.test(location.hash)) return;
    if (uploading || document.querySelector(".viewer")) return; // 사진 올리는 중·크게 보는 중엔 그대로
    const rec = $("record");
    if (rec && rec.value !== rec.defaultValue) return;
    route(true);
  });
  route();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
